name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: production-default
            site_url: ''
            site_noindex: 'false'
          - name: url-override
            site_url: https://gaming.example.test
            site_noindex: 'false'
          - name: explicit-noindex
            site_url: ''
            site_noindex: 'true'
    name: verify (${{ matrix.name }})
    env:
      SITE_URL: ${{ matrix.site_url }}
      SITE_NOINDEX: ${{ matrix.site_noindex }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
