name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Verify indexing with SITE_URL overridden
        env:
          SITE_URL: https://gaming.example.test
        run: |
          pnpm build
          node --test --test-name-pattern='^SEO:' tests/site.test.mjs
      - name: Verify CLI URL precedence with NODE_ENV overridden
        run: |
          SITE_URL=https://gaming.example.test NODE_ENV=development pnpm build --site https://override.example.test
          SITE_URL=https://override.example.test node --test --test-name-pattern='^SEO:' tests/site.test.mjs
      - name: Verify explicit noindex with a CLI URL
        env:
          SITE_NOINDEX: 'true'
        run: |
          pnpm build --site https://override.example.test
          node --test --test-name-pattern='^SEO:' tests/site.test.mjs
      - name: Verify dev indexing with NODE_ENV overridden
        run: NODE_ENV=production node --test tests/development.test.mjs
      - name: Reject a site URL containing a subpath
        run: |
          if pnpm build --site https://override.example.test/games/ > "$RUNNER_TEMP/site-validation.log" 2>&1; then
            echo 'Expected the build to reject --site with a subpath'
            exit 1
          fi
          grep -F 'HTTPSのオリジンを指定してください' "$RUNNER_TEMP/site-validation.log"
